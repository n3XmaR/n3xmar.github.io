
media:
  - name: writeups
    label: Writeup Images
    input: public/images/writeups
    output: /images/writeups
    rename: safe

  - name: projects
    label: Project Images
    input: public/images/projects
    output: /images/projects
    rename: safe

  - name: certificates
    label: Certificate Images
    input: public/images/certificates
    output: /images/certificates
    rename: safe

content:
  # =========================
  # Rabbit Holes
  # =========================
  - name: rabbit-holes
    label: Rabbit Holes
    type: collection
    path: src/content/rabbit-holes
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, category, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: category
        label: Category
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: writeups

  # =========================
  # Projects
  # =========================
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: tags
        label: Tags
        type: string
        list: true

      - name: image
        label: Cover Image
        type: image
        options:
          media: projects

      - name: github
        label: GitHub URL
        type: string

      - name: body
        label: Project Content
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: projects

  # =========================
  # Certificates
  # =========================
  - name: certificates
    label: Certificates
    type: collection
    path: src/content/certificates
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, issuer, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: issuer
        label: Issuer
        type: string
        required: true

      - name: image
        label: Certificate Image
        type: image
        required: true
        options:
          media: certificates

      - name: date
        label: Date Earned
        type: date
        options:
          format: yyyy-MM-dd

      - name: credentialUrl
        label: Credential URL
        type: string

      - name: body
        label: Certificate Details
        type: rich-text
        options:
          format: markdown
          switcher: true
