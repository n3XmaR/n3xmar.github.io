
media:
  input: public/images/writeups
  output: /images/writeups
  rename: safe

content:
  - name: rabbit-holes
    label: Rabbit Holes
    type: collection
    path: src/content/rabbit-holes
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, category, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: category
        label: Category
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          switcher: true
